name: bumper

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bumper
      AUTH_PASSWORD: ${AUTH_PASSWORD}
    command: >
      postgres
      -c shared_buffers=96MB
      -c max_connections=25
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bumper"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 320m

  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PGRST_DB_URI: postgres://authenticator:${AUTH_PASSWORD}@db:5432/bumper
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_ROLE_CLAIM_KEY: .role
      PGRST_DB_POOL: 8
      PGRST_LOG_LEVEL: info
      PGRST_SERVER_PORT: 3000
    mem_limit: 96m

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "10443:443"
    volumes:
      - ./nginx/bumper.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme-webroot:/var/www/acme:ro
    mem_limit: 64m

volumes:
  pgdata:
