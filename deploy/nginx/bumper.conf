upstream rest_api {
    server api:3000;
    keepalive 8;
}

# ---------- 80：只做证书验证 + 跳转，不提供网页 ----------
server {
    listen 80;
    listen [::]:80;
    server_name bumper.fat.plus;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host:10443$request_uri;
    }
}

# ---------- 10443：正式网页（合规要求不用 443） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bumper.fat.plus;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    client_body_timeout  30s;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 前端用的 supabase-js 会请求 /rest/v1/xxx，剥掉前缀转给 PostgREST
    location /rest/v1/ {
        proxy_pass http://rest_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 页面本体不缓存，改了 html 立刻生效；图片和 vendor 走长缓存
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~* \.(jpg|jpeg|png|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~* /vendor/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /favicon.ico { return 204; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/bumper.access.log;
    error_log  /var/log/nginx/bumper.error.log warn;
}
